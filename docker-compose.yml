services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nagar-api

    restart: unless-stopped

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - photo_uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - backend


volumes:
  photo_uploads:

networks:
  backend:
    driver: bridge
